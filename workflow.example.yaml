# Consumer contract, validated by spwf.config.load_config.
# Copy to workflow.yaml (gitignored); replace the board and prefix for your repo.
board: YOUR_BOARD_SHORTLINK
prefix: ws
lists:
  doing: "🔧 Doing (WIP ≤ 3)"
  blocked: "⏸️ Blocked / Waiting on Alex"
  review: "👀 Review / Read"
  done_prefix: "✅ Done — "
  reference: "📌 Program & Gates"
experiment_label: "T: Experiment"
allow_done_from_push: true
timezone: America/Vancouver
# REQUIRED for ordinary Done moves. Confirm the actual board suffix first.
# Supported: '%Y-%m', '%B', '%B %Y', '%b %Y'. No default is guessed.
