[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spwf"
version = "0.1.0"
description = "Board-agnostic GitHub to Trello workflow automation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.31,<3", "pydantic>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
spwf = "spwf.cli:main"

[tool.setuptools.packages.find]
include = ["spwf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
