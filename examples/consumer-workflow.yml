# Pinned to the CI-verified offline integration baseline (51838ad).
# Save as .github/workflows/trello.yml in the consumer repo.
# When upgrading, update BOTH workflow and runner-ref to the same reviewed SHA.
name: Trello
on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, closed]
  # Optional: replace CI with the actual consumer CI workflow name.
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
  pull-requests: read
jobs:
  trello:
    uses: oz-tmg/trello-hub/.github/workflows/trello-sync.yml@51838ad34e06c340ed8a3a493af3f885a82b4007
    with:
      runner-ref: 51838ad34e06c340ed8a3a493af3f885a82b4007
      configuration: ${{ vars.SPWF_CONFIG }}
      dry-run: true  # Change only after the read-only smoke and preview review.
      snapshot: ${{ vars.SPWF_SNAPSHOT }}  # Optional, sanitized card facts for offline preview.
    secrets:
      TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
      TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
