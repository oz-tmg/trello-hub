name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Test configuration, events and transition guards
        run: python -m pytest
      - name: Check package entrypoints
        run: |
          spwf --version
          python -m spwf --help
          spwf sync --config examples/workflow.yaml --event-name push --event-path examples/push.json --snapshot examples/snapshot.json --dry-run

  reusable-preview:
    uses: ./.github/workflows/trello-sync.yml
    with:
      runner-ref: ${{ github.sha }}
      dry-run: true
      configuration: |
        board: AbCd1234
        prefix: ws
        lists:
          doing: Doing
          blocked: Blocked
          review: Review
          done_prefix: 'Done — '
          reference: Program & Gates
